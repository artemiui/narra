[package]
name = "narra"
version = "0.1.0"
edition = "2021"
license = "MIT"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
font-kit = "0.14"
notify = "8"
uuid = { version = "1", features = ["v4","serde"] }
tempfile = "3"
[profile.release]
lto = "thin"
strip = true

